
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermes Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 280px;
            background: #1e293b;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #334155;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #60a5fa;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .new-chat-btn {
            width: 100%;
            padding: 12px;
            margin-top: 16px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background: #2563eb;
        }

        .sessions-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .session-item {
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 4px;
        }

        .session-item:hover {
            background: #334155;
        }

        .session-item.active {
            background: #334155;
        }

        .session-name {
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .message {
            max-width: 800px;
            margin: 0 auto 24px;
            padding: 16px;
            border-radius: 12px;
        }

        .message.user {
            background: #1e293b;
        }

        .message.assistant {
            background: #0f172a;
            border: 1px solid #334155;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .message-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .message.user .message-avatar {
            background: #3b82f6;
        }

        .message.assistant .message-avatar {
            background: #60a5fa;
        }

        .message-role {
            font-weight: 600;
            font-size: 14px;
        }

        .message-content {
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .input-container {
            padding: 20px;
            border-top: 1px solid #334155;
        }

        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
        }

        #chat-input {
            flex: 1;
            padding: 14px 18px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 15px;
            resize: none;
            outline: none;
        }

        #chat-input:focus {
            border-color: #3b82f6;
        }

        #send-btn {
            padding: 14px 28px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        #send-btn:hover {
            background: #2563eb;
        }

        #send-btn:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        .welcome-screen {
            max-width: 600px;
            margin: 100px auto;
            text-align: center;
        }

        .welcome-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 16px;
            color: #60a5fa;
        }

        .welcome-subtitle {
            color: #94a3b8;
            font-size: 16px;
            margin-bottom: 32px;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .quick-action {
            padding: 16px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: border-color 0.2s;
        }

        .quick-action:hover {
            border-color: #3b82f6;
        }

        .quick-action-title {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .quick-action-desc {
            font-size: 13px;
            color: #94a3b8;
        }

        /* Typing indicator */
        .typing-dots span {
            animation: blink 1.4s infinite;
            animation-fill-mode: both;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {
            0%, 80%, 100% {
                opacity: 0;
            }
            40% {
                opacity: 1;
            }
        }

        /* Connection status */
        .connection-status {
            position: fixed;
            top: 12px;
            right: 12px;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 1000;
        }

        .connection-status.connected {
            background: #10b981;
            color: white;
        }

        .connection-status.disconnected {
            background: #ef4444;
            color: white;
        }
    </style>
</head>
<body>
    <div id="connection-status" class="connection-status disconnected">Disconnected</div>

    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    🦅 Hermes
                </div>
                <button class="new-chat-btn" id="new-chat-btn">+ New Chat</button>
            </div>
            <div class="sessions-list" id="sessions-list">
            </div>
        </div>

        <div class="main-content">
            <div class="chat-container" id="chat-container">
                <div class="welcome-screen" id="welcome-screen">
                    <div class="welcome-title">Welcome to Hermes Agent</div>
                    <div class="welcome-subtitle">Start a conversation to get things done</div>
                    <div class="quick-actions">
                        <div class="quick-action" data-prompt="Help me write a Python script">
                            <div class="quick-action-title">Write code</div>
                            <div class="quick-action-desc">Generate scripts and applications</div>
                        </div>
                        <div class="quick-action" data-prompt="What files are in this directory?">
                            <div class="quick-action-title">Explore files</div>
                            <div class="quick-action-desc">Browse and edit files</div>
                        </div>
                        <div class="quick-action" data-prompt="Explain how this project works">
                            <div class="quick-action-title">Analyze project</div>
                            <div class="quick-action-desc">Understand code structure</div>
                        </div>
                        <div class="quick-action" data-prompt="Debug this error for me">
                            <div class="quick-action-title">Fix issues</div>
                            <div class="quick-action-desc">Troubleshoot problems</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="input-container">
                <div class="input-wrapper">
                    <textarea id="chat-input" placeholder="Send a message..." rows="1"></textarea>
                    <button id="send-btn">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
