[workspace]
members = [
    "crates/hermes-core",
    "crates/hermes-cli",
    "crates/hermes-web",
    "crates/hermes-tools",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Hermes Team"]
license = "MIT"

[workspace.dependencies]
# 核心依赖
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
config = "0.14"
toml = "0.8"
once_cell = "1.0"

# Web相关
axum = "0.7"
axum-extra = { version = "0.8", features = ["spa"] }
tower-http = { version = "0.5", features = ["fs", "cors", "auth", "trace", "limit", "timeout"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# CLI相关
clap = { version = "4.0", features = ["derive"] }
color-eyre = "0.6"

# 工具相关
reqwest = { version = "0.12", features = ["json", "stream", "socks"] }
base64 = "0.22"
